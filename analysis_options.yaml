include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    dead_code: warning
    # unawaited_futures genera warnings en código existente que es intencional
    # Se revisan manualmente los casos críticos
    unawaited_futures: info
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    # Seguridad — detectan bugs reales
    cancel_subscriptions: true
    close_sinks: true
    unawaited_futures: true

    # Flutter / rendimiento
    prefer_const_constructors: true
    prefer_const_declarations: true
    sized_box_for_whitespace: true
    use_build_context_synchronously: true
