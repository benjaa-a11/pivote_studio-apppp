workflows:
  pivote-android:
    name: Pivote - Android APK
    max_build_duration: 60

    environment:
      flutter: 3.41.6
      java: 17

    scripts:
      - name: Verify build toolchain
        script: |
          flutter --version
          dart --version
          java -version
          flutter doctor -v

      - name: Resolve dependencies
        script: |
          flutter pub get

      - name: Build release APK
        script: |
          flutter build apk --release --verbose

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - flutter_build_*.log

    publishing:
      email:
        recipients:
          - benjaferrer83@gmail.com
